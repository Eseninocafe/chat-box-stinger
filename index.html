<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eseninocafe — Multichat Stingers</title>
<!-- The Inter build Figma uses, for the connection label -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@4.5.15/600.css">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<div id="stage">
  <canvas id="jarCv"></canvas>
  <canvas id="stingerCv"></canvas>
</div>

<div id="hud" hidden>
  <button class="btn" id="throw1Btn">Throw bit</button>
  <button class="btn" id="throw10Btn">Throw 10</button>
  <span class="group">
    <input class="num" id="cheerAmt" type="number" value="1234" min="1" step="1">
    <button class="btn" id="cheerBtn">Cheer</button>
  </span>
  <button class="btn" id="subBtn">Sub stinger</button>
  <button class="btn" id="donoBtn">Donation stinger</button>
  <span class="group">
    <input class="num" id="raidAmt" type="number" value="5" min="1" step="1">
    <button class="btn" id="raidBtn">Raid</button>
  </span>
  <button class="btn" id="replayBtn">Replay intro</button>
  <button class="btn" id="demoBtn">Demo fill</button>
  <button class="btn" id="resetBtn">Reset bits</button>
  <label class="chk"><input type="checkbox" id="debugChk"> jar walls</label>
  <label class="chk"><input type="checkbox" id="gemDebugChk"> gem bounds</label>
  <label class="chk"><input type="checkbox" id="arcDebugChk"> throw arcs</label>
  <span class="tag" id="bitCount">bits: 0</span>
</div>

<script src="assets/vendor/matter.min.js"></script>
<script>
  // Variant from the browser-source size: 400x400 -> compact, 596x596 -> normal.
  // ?variant=compact|normal overrides it (handy for testing in a full browser window).
  window.VARIANT = ['compact', 'normal'].includes(new URLSearchParams(location.search).get('variant'))
    ? new URLSearchParams(location.search).get('variant')
    : (Math.min(innerWidth, innerHeight) >= 500 ? 'normal' : 'compact');
  document.write('<script src="assets/' + VARIANT + '/tip-jar-stinger/collision.js?v=3"><\/script>');
  // normal's donation stinger is drawn in code: the paper bag and the receipt taped to it
  if (VARIANT === 'normal') ['receipt-physics', 'receipt-html', 'paperbag-stinger'].forEach(f =>
    document.write('<script src="assets/normal/donation-stinger/' + f + '.js?v=1"><\/script>'));
</script>
<script type="text/javascript" src="https://unpkg.com/@streamerbot/client/dist/streamerbot-client.js"></script>
<script src="script.js?v=5"></script>
</body>
</html>
